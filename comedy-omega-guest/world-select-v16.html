<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comedy Commandos | World Select v16</title><style>body{background:#10101f;color:#fff;font:16px system-ui;margin:0;padding:12vh 7vw;text-align:center}h1{color:#ffe05b;font:italic 900 clamp(24px,6vw,48px) Impact,sans-serif}progress{width:min(90%,450px);accent-color:#ffdc5a}a{color:#aaddff}</style></head><body><h1>COMEDY COMMANDOS</h1><p id="s">Loading original stages and fighters…</p><progress id="p" max="6" value="0"></progress><p><a href="./index.html">Original full game</a> · <a href="./illustrated-arena-v15.html">Previous 3D edition</a></p><script>(async()=>{const status=document.getElementById('s'),bar=document.getElementById('p');try{const blocks=await Promise.all(Array.from({length:6},async(_,i)=>{const r=await fetch('world-v16-'+i+'.txt');if(!r.ok)throw Error('Missing stage package '+i);const t=await r.text();bar.value++;return t}));const html=blocks.join('');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))).map(b=>b.toString(16).padStart(2,'0')).join('');if(digest!=='99566bbbf23277b96734098637aa729618f46ea6d23ede90af624982f066e630')throw Error('Package integrity mismatch');document.open();document.write(html);document.close()}catch(e){status.textContent='Could not open v16: '+e.message+'. Use a previous version below.'}})();</script></body></html>
